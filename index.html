<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Egy nap a Katedra Középiskolában</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: clock/stat bar, day progress pips, notebook, one illustrated scene (boxy buildings, floor plans, mini-games), one guide card. Single chalkboard look by choice; scenes are drawn in daylight colours. */
:root{
  color-scheme:dark;
  --bg:#0f1c1a;
  --panel:#172a27;
  --panel-2:#1f3a36;
  --line:#365a53;
  --ink:#f1ede2;
  --muted:#a8bdb5;
  --accent:#ee7d52;
  --accent-ink:#2a0d04;
  --good:#7fd6a0;
  --good-ink:#06230f;
  --bad:#ff8593;
  --warn:#f4cd5c;
  --font-display:'Rubik','Arial Narrow',sans-serif;
  --font-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{background:var(--bg);min-height:100%}
body{min-height:100vh;min-height:100dvh;box-sizing:border-box;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.5;margin:0;padding-block:20px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.eyebrow{margin:0 0 6px;font-family:var(--font-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--font-display);font-weight:800;font-size:clamp(32px,8vw,52px);line-height:1;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{margin:8px 0 0;color:var(--muted);max-width:62ch}
.hud{display:flex;gap:8px;flex-wrap:wrap;scroll-margin-top:8px}
.clock{flex:1 1 220px;min-width:0;display:flex;align-items:baseline;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px}
.clock b{font-family:var(--font-mono);font-weight:500;font-size:30px;font-variant-numeric:tabular-nums;color:var(--warn)}
.clock span{color:var(--muted);font-size:15px;min-width:0}
.stat{display:flex;align-items:baseline;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px}
.stat b{font-family:var(--font-display);font-weight:800;font-size:24px;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:14px}
.pips{display:flex;gap:5px;list-style:none;margin:0;padding:0;flex-wrap:wrap}
.pips li{width:22px;height:8px;border-radius:4px;background:var(--panel-2);border:1px solid var(--line)}
.pips li.done{background:var(--good);border-color:var(--good)}
.pips li.current{background:var(--accent);border-color:var(--accent)}
details.nb{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px}
details.nb summary{cursor:pointer;font-weight:700}
details.nb ul{margin:8px 0 2px;padding-left:20px;display:flex;flex-direction:column;gap:4px;color:var(--muted)}
.stage{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--panel)}
.stage svg{display:block;width:100%;height:auto}
.pscroll.plan{overflow-x:auto}
.pscroll.plan svg{min-width:620px}
.liftbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 10px;background:var(--panel);border-top:1px solid var(--line)}
.liftlab{font-family:var(--font-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.liftbar button{min-width:38px;height:38px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);font:500 15px var(--font-mono);cursor:pointer}
.liftbar button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.liftbar button:hover{border-color:var(--accent)}
.hit{cursor:pointer}
.hit:hover{filter:brightness(1.1)}
.hit:focus-visible{outline:3px solid #f4cd5c;outline-offset:2px}
.floor.sel rect:first-child{filter:brightness(1.06)}
.me{transition:transform .9s ease-in-out;pointer-events:none}
.room .rm{fill:rgba(158,208,240,.10);stroke:#9ed0f0;stroke-width:1.5}
.room:hover .rm{fill:rgba(158,208,240,.26)}
.room.good .rm{fill:rgba(127,214,160,.45);stroke:#7fd6a0;stroke-width:3}
.room.bad .rm{fill:rgba(255,133,147,.5);stroke:#ff8593;stroke-width:3}
.room text{font-family:var(--font-body);font-weight:700;font-size:17px;fill:#dff1ff;text-anchor:middle;pointer-events:none}
.pot{transition:transform .15s}
.pot.sel{transform:translateY(-14px)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font-family:var(--font-display);font-weight:800;font-size:clamp(22px,4.6vw,30px);margin:0;line-height:1.1}
.card p{margin:0}
.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.tag{background:var(--accent);color:var(--accent-ink);font-family:var(--font-mono);font-weight:500;border-radius:4px;padding:2px 10px;letter-spacing:.08em;text-transform:uppercase;font-size:12px}
.def{font-size:clamp(18px,4.2vw,21px);font-weight:700;line-height:1.35;text-wrap:balance}
.task{color:var(--muted)}
.talk{display:flex;gap:12px;align-items:flex-start}
.av svg{display:block;width:56px;height:56px}
.bubble{position:relative;flex:1 1 0;min-width:0;background:var(--panel-2);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.bubble::before{content:"";position:absolute;left:-8px;top:14px;width:14px;height:14px;background:var(--panel-2);border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.who{font-weight:700;font-size:14px}
.who span{font-weight:400;color:var(--muted);margin-left:8px}
.say{color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-weight:700;font-size:16px;padding:10px 18px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.fb{min-height:1.5em;font-weight:700}
.fb.good{color:var(--good)}
.fb.bad{color:var(--bad)}
a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.intro{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.intro>div{flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:10px}
.field{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lab{min-width:64px;font-weight:700}
.txt{flex:1 1 200px;min-width:0;font:inherit;font-size:18px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.swatch.on{outline:3px solid var(--accent);outline-offset:2px}
.hintline{color:var(--muted);font-size:15px}
.route2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.lab3{font-family:var(--font-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.stepsl{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0;min-height:48px}
.stepb{width:100%;text-align:left;font:inherit;font-size:16px;font-weight:700;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);cursor:pointer}
.stepb:hover{border-color:var(--accent)}
.stepb.ok{border-color:var(--good);background:rgba(127,214,160,.18)}
.stepb.no{border-color:var(--bad);background:rgba(255,133,147,.16)}
.dirs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:380px}
.dirs button{font:inherit;font-size:26px;font-weight:700;padding:12px 0;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);cursor:pointer}
.dirs button:hover:not(:disabled){border-color:var(--accent)}
.prog{display:flex;flex-wrap:wrap;gap:6px;min-height:44px}
.prog span{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);font-size:22px;font-weight:700}
.prog span.run{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.prog span.empty{background:transparent;border-style:dashed;opacity:.5}
.lock{display:flex;gap:14px;flex-wrap:wrap}
.dig{display:flex;flex-direction:column;align-items:center;gap:6px}
.dig button{width:56px;height:40px;font:inherit;font-size:18px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);cursor:pointer}
.dig button:hover{border-color:var(--accent)}
.dig output{display:grid;place-items:center;width:56px;height:64px;border-radius:8px;border:2px solid var(--warn);background:var(--bg);font-family:var(--font-mono);font-size:34px;color:var(--warn)}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}
.act{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;font:inherit;font-size:16px;font-weight:700;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);cursor:pointer}
.act b{font-family:var(--font-mono);font-weight:500;color:var(--warn);white-space:nowrap}
.act[aria-pressed="true"]{border-color:var(--accent);background:rgba(238,125,82,.2)}
.slrow{display:grid;grid-template-columns:70px 1fr 44px;gap:10px;align-items:center}
.slrow input[type=range]{width:100%;accent-color:var(--accent);min-width:0}
.slrow output{font-family:var(--font-mono);text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-weight:700;padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--panel-2);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cert{border:3px double var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:8px;text-align:center;background:var(--panel-2)}
.cert-co{font-family:var(--font-mono);letter-spacing:.12em;text-transform:uppercase;font-size:13px;color:var(--muted)}
.cert-name{font-family:var(--font-display);font-weight:800;font-size:clamp(28px,7vw,40px);line-height:1.05;color:var(--accent);overflow-wrap:anywhere}
.cert-row{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:8px;text-align:left}
.cert-row b{text-align:right;min-width:0;overflow-wrap:anywhere}
.day{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;font-size:15px;text-align:left}
.day li{display:grid;grid-template-columns:52px 1fr auto;gap:8px}
.day li span:first-child{font-family:var(--font-mono);color:var(--warn)}
.day li span:last-child{color:var(--warn);letter-spacing:.1em}
.copyrow{display:flex;gap:8px;flex-wrap:wrap}
.copyrow input{flex:1 1 200px;min-width:0;font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.tchip{font:inherit;font-weight:700;min-width:78px;padding:8px 12px;border-radius:10px;border:2px solid;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.tchip b{font-family:var(--font-display);font-weight:800;font-size:24px}
.tchip span{font-size:13px}
.tchip.r{background:#c9302c;border-color:#e0605c}
.tchip.b{background:#2b6fe0;border-color:#6aa0f0}
.burst{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-in-out infinite}
.conf{animation:floaty 2.6s ease-in-out infinite alternate}
@keyframes pulse{0%,100%{transform:scale(.85);opacity:.8}50%{transform:scale(1.1);opacity:1}}
@keyframes floaty{from{transform:translateY(-10px)}to{transform:translateY(12px)}}
@media (prefers-reduced-motion:reduce){.me,.pot{transition:none}.burst,.conf{animation:none}}
</style>
</head>
<body>

<main class="wrap">
  <header>
    <p class="eyebrow">Nyílt nap · Diák egy napra</p>
    <h1>Katedra Középiskola</h1>
    <p class="sub">Tölts el egy napot az iskolánkban! Keresd meg a helyes termeket, és oldd meg a feladványokat. A napod 7:50-kor kezdődik, a tanítás 8:15-kor.</p>
  </header>
  <div class="hud" id="hud">
    <div class="clock"><b id="clock">07:50</b><span id="place">A nap kezdete előtt</span></div>
    <div class="stat"><b id="stars">0</b><span>csillag</span></div>
    <div class="stat"><b id="lost">0</b><span>elvesztett perc</span></div>
  </div>
  <ol class="pips" id="pips" aria-label="A napod"></ol>
  <details class="nb" id="nb"><summary>Jegyzetfüzetem (<span id="nbn">0</span>)</summary><ul id="nbl"></ul></details>
  <div class="stage" id="stage"></div>
  <section class="card" id="card"></section>
</main>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function shuffle(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=b[i];b[i]=b[j];b[j]=t}return b}
function P(pts){return pts.map(function(p){return p.join(',')}).join(' ')}
function pad2(n){return (n<10?'0':'')+n}
function clock(m){return pad2(Math.floor(m/60))+':'+pad2(m%60)}

var HOODS=['#2f7de1','#2fa37a','#9b59d0','#e0873a'],HNAMES=['Kék','Zöld','Lila','Narancs'];
var CAST={
  zoe:{n:'Zoe',r:'Osztálytárs',suit:'#d0583a',hair:'#3b2a20',skin:'#e0a97c',bg:'#2d4a5a'},
  kra:{n:'Krammer tanár úr',r:'Informatikatanár',suit:'#17785c',hair:'#7a4a26',skin:'#f0c29a',bg:'#12404a'},
  kapas:{n:'Kapás tanárnő',r:'Igazgatóhelyettes',suit:'#444d66',hair:'#8a8f99',skin:'#f0c29a',bg:'#3b2f44'},
  kiss:{n:'Irénke néni',r:'Titkárnő',long:1,suit:'#8a4fbf',hair:'#e9c872',skin:'#f3cba6',bg:'#2d2a58'},
  prin:{n:'Tubak igazgató úr',r:'Igazgató',beard:1,suit:'#2b3350',hair:'#9aa0aa',skin:'#e0a97c',bg:'#40324a'},
  norek:{n:'Norek tanárnő',r:'Művészettanár',long:1,suit:'#c9822b',hair:'#4a2e1d',skin:'#f3cba6',bg:'#4a3224'},
  szabo:{n:'Zsolczai tanár úr',r:'Grafikatanár',suit:'#2d7fa8',hair:'#3a2a20',skin:'#f0c29a',bg:'#27394a'}
};
var STEPS=[
  {t:'07:50',place:'Főkapu',lbl:'Keresd meg a bejáratot',run:stepGate},
  {t:'08:05',place:'Földszintről az 1. emeletre',lbl:'Tervezd meg az utat',run:stepRoute},
  {t:'09:05',place:'A 2. óra előtt',lbl:'Keresd meg az informatikatermet',run:stepITFind},
  {t:'09:20',place:'2. óra · Informatika',lbl:'Programozd a robotot',run:stepRobot},
  {t:'09:58',place:'Nagyszünet · 2. emelet',lbl:'Keresd meg az irodát',run:stepAssist},
  {t:'10:02',place:'Nagyszünet · az udvar',lbl:'Keresd meg a Fehér Házat',run:stepWhite},
  {t:'10:05',place:'Nagyszünet · Fehér Ház',lbl:'Nyisd ki a dobozt',run:stepLock},
  {t:'11:00',place:'A 4. óra előtt',lbl:'Keresd meg a műtermet',run:stepArtFind},
  {t:'11:15',place:'4. óra · Művészet',lbl:'Keverd ki a színeket',run:stepMix},
  {t:'13:40',place:'Ebédszünet',lbl:'Keresd meg a büfét',run:stepKiosk},
  {t:'13:45',place:'Ebédszünet',lbl:'Tervezd meg az ebédet',run:stepPlan},
  {t:'14:15',place:'7. óra · Grafika',lbl:'Keverd ki a színt',run:stepRGB},
  {t:'15:05',place:'8. óra · Sportnap',lbl:'Alkoss igazságos csapatokat',run:stepSport},
  {t:'15:50',place:'A nap vége',lbl:'A nap vége',run:stepFinale}
];
var NP=13;
var S={name:'',hood:0,step:-1,stars:[],lost:0,notes:[],mist:0,hint:false,cap:3,locked:false,timers:[]};
var stage=$('stage'),card=$('card');

function N(){return esc(S.name||'Alex')}
function later(fn,ms){var id=setTimeout(fn,reduce?Math.min(ms,60):ms);S.timers.push(id);return id}
function clearT(){S.timers.forEach(clearTimeout);S.timers=[]}
function fb(t,c){var f=$('fb');if(!f)return;f.textContent=t;f.className='fb'+(c?' '+c:'')}
function total(){return S.stars.reduce(function(a,b){return a+(b||0)},0)}
function renderHud(){
  var st=S.step<0?null:STEPS[S.step];
  $('clock').textContent=st?st.t:'07:50';
  $('place').textContent=st?st.place:'A nap kezdete előtt';
  $('stars').textContent=total();$('lost').textContent=S.lost;
}
function renderPips(){
  var h='';
  for(var i=0;i<STEPS.length;i++){var c=i<S.step?'done':(i===S.step?'current':'');h+='<li class="'+c+'" title="'+STEPS[i].lbl+'"></li>'}
  $('pips').innerHTML=h;
}
function renderNotes(){
  $('nbn').textContent=S.notes.length;
  $('nbl').innerHTML=S.notes.length?S.notes.map(function(n){return '<li>'+esc(n)+'</li>'}).join(''):'<li>Még semmi. Az új tények itt jelennek meg.</li>';
}
function addNote(t){if(S.notes.indexOf(t)<0){S.notes.push(t);renderNotes()}}
function wrong(msg,cost){cost=cost||3;S.mist++;S.lost+=cost;renderHud();fb(msg+' (+'+cost+' perc)','bad')}
function finishP(){var st=S.mist===0?3:(S.mist<=2?2:1);if(S.hint)st=Math.min(st,2);st=Math.min(st,S.cap);S.stars[S.step]=st;renderHud();return st}
function solve(msg,notes){
  if(S.locked)return;S.locked=true;
  var st=finishP();
  fb(msg+'  '+new Array(st+1).join('★')+new Array(4-st).join('☆'),'good');
  (notes||[]).forEach(addNote);
  var b=document.createElement('div');b.className='row';
  b.innerHTML='<button class="btn" id="nx" type="button">'+(S.step===NP-1?'A nap vége':'Tovább')+'</button>';
  card.appendChild(b);
  var n=$('nx');n.onclick=function(){go(S.step+1)};
  try{n.focus({preventScroll:true})}catch(e){}
}
function go(i){
  clearT();S.step=i;S.mist=0;S.hint=false;S.cap=3;S.locked=false;
  $('nb').open=false;$('stage').parentNode.insertBefore($('nb'),$('stage'));
  renderHud();renderPips();
  STEPS[i].run();
  try{$('hud').scrollIntoView({block:'start',behavior:reduce?'auto':'smooth'})}catch(e){}
}
var avN=0;
function avatar(sp){
  avN++;var id='av'+avN;

function cub(x,y,w,h,dx,dy,c){
  return '<polygon points="'+x+','+y+' '+(x+w)+','+y+' '+(x+w+dx)+','+(y-dy)+' '+(x+dx)+','+(y-dy)+'" fill="'+c.top+'"/>'+
  '<polygon points="'+(x+w)+','+y+' '+(x+w+dx)+','+(y-dy)+' '+(x+w+dx)+','+(y+h-dy)+' '+(x+w)+','+(y+h)+'" fill="'+c.side+'"/>'+
  '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+c.front+'"/>';
}
function sideWin(x,y,w,dx,dy,t0,t1,v0,v1,fill){
  var X0=x+w+t0*dx,X1=x+w+t1*dx,Y0=y+v0-t0*dy,Y1=y+v0-t1*dy,H=v1-v0;
  return '<polygon points="'+X0+','+Y0+' '+X1+','+Y1+' '+X1+','+(Y1+H)+' '+X0+','+(Y0+H)+'" fill="'+fill+'"/>';
}

  stage.innerHTML=s;
  setCard(frame(CAST.kra,'Üdv az informatikateremben, '+N()+'! Itt mindenkinek van saját számítógépe. Ma egy programozós feladványt oldunk meg.','<p class="def">Koppints a nyilakra, és rakj össze egy programot. Aztán nyomd meg az Indítás gombot. A robotnak el kell jutnia a zászlóhoz. A padokon nem tud átmenni.</p><div class="prog" id="prog" aria-live="polite"></div><div class="dirs" id="dirs"><button type="button" data-d="U" aria-label="Fel">↑</button><button type="button" data-d="D" aria-label="Le">↓</button><button type="button" data-d="L" aria-label="Balra">←</button><button type="button" data-d="R" aria-label="Jobbra">→</button></div><div class="row"><button class="btn" id="run" type="button">Indítás</button><button class="btn ghost" id="undo" type="button">Vissza</button><button class="btn ghost" id="clr" type="button">Törlés</button></div>'));
  wireHint('Előbb gondolkodj! Menj jobbra, aztán felfelé. Keress szabad utat a padok között.');
  var AR={U:'↑',D:'↓',L:'←',R:'→'};
  function drawProg(cur){
    var h='';for(var i=0;i<12;i++){h+=i<prog.length?'<span class="'+(i===cur?'run':'')+'">'+AR[prog[i]]+'</span>':'<span class="empty"></span>'}

function stepSport(){
  var red=SPORT.map(function(v,i){return i<4}),TOT=SPORT.reduce(function(a,b){return a+b},0);
  function sums(){var r=0,n=0;red.forEach(function(x,k){if(x){r+=SPORT[k];n++}});return {r:r,b:TOT-r,n:n}}
  setCard(frame(CAST.zoe,'Tudtad? A Katedrában minden évben sportnapot szervezünk. Ilyenkor minden diák együtt játszik. Ma kötélhúzás lesz, de a csapatok nem igazságosak. Segítesz?','<p class="def">Minden szám egy játékos ereje. Koppints egy játékosra, hogy átkerüljön a másik csapatba. Alkoss két 4 fős csapatot. A két csapat ereje legyen egyforma.</p><div class="chips" id="team"></div><p class="task" id="tsum" aria-live="polite"></p><div class="row"><button class="btn" id="go2" type="button">Kezdődjön a játék!</button></div>'));
  wireHint('Add össze az összes számot. Az összeg '+TOT+'. Mindkét csapatnak '+(TOT/2)+' kell.');
  function draw(win){
    stage.innerHTML=sportSVG(red,win);
    var t=sums();
    $('team').innerHTML=SPORT.map(function(v,k){return '<button type="button" class="tchip '+(red[k]?'r':'b')+'" data-k="'+k+'" aria-label="'+v+' erejű játékos, '+(red[k]?'piros':'kék')+' csapat"><b>'+v+'</b><span>'+(red[k]?'Piros':'Kék')+'</span></button>'}).join('');
    $('tsum').textContent='Piros csapat: '+t.r+'  ·  Kék csapat: '+t.b+'  ·  A pirosban '+t.n+' játékos van';
    card.querySelectorAll('.tchip').forEach(function(b){b.onclick=function(){if(S.locked)return;var k=+b.getAttribute('data-k');red[k]=!red[k];draw()}});
  }
  $('go2').onclick=function(){
    if(S.locked)return;var t=sums();
    if(t.n!==4){wrong('Mindkét csapatban 4 játékos kell. A piros csapatban most '+t.n+' van.',2);return}
    if(t.r!==t.b){wrong('A kötél a '+(t.r>t.b?'piros':'kék')+' csapat felé mozdul, mert ők erősebbek. Változtass a csapatokon.',2);return}
    draw(true);
    solve('Igazságos csapatok! A kötél meg sem mozdul. Mindenki ujjong.',['A Katedrában minden évben van sportnap.']);
  };
  draw();
}

/* ---------- the end of the day ---------- */
function celebrateSVG(){
  var seed=11;function rnd(){seed=(seed*9301+49297)%233280;return seed/233280}
  var i,s='<svg viewBox="0 0 800 380" role="img" aria-label="Ünneplés: Katedra Középiskola felirat tűzijátékkal, zászlókkal és konfettivel">';
  s+='<defs><linearGradient id="nt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16224f"/><stop offset="1" stop-color="#4a3470"/></linearGradient></defs><rect width="800" height="380" fill="url(#nt)"/>';
  for(i=0;i<46;i++)s+='<circle cx="'+Math.round(rnd()*800)+'" cy="'+Math.round(rnd()*250)+'" r="'+(1+rnd()*1.6).toFixed(1)+'" fill="#fff7e8" opacity="'+(0.4+rnd()*0.6).toFixed(2)+'"/>';
  [[96,120,'#ff8593',0],[706,108,'#f4cd5c',.5],[56,262,'#5cc8ff',1],[748,266,'#b48cff',1.5],[400,52,'#7fd6a0',.8]].forEach(function(f){
    s+='<g class="burst" style="animation-delay:'+f[3]+'s"><circle cx="'+f[0]+'" cy="'+f[1]+'" r="5" fill="'+f[2]+'"/>';
    for(var k=0;k<14;k++){
      var a=k*Math.PI*2/14,c=Math.cos(a),n=Math.sin(a);
      s+='<line x1="'+(f[0]+c*16).toFixed(1)+'" y1="'+(f[1]+n*16).toFixed(1)+'" x2="'+(f[0]+c*46).toFixed(1)+'" y2="'+(f[1]+n*46).toFixed(1)+'" stroke="'+f[2]+'" stroke-width="4" stroke-linecap="round"/><circle cx="'+(f[0]+c*58).toFixed(1)+'" cy="'+(f[1]+n*58).toFixed(1)+'" r="3" fill="'+f[2]+'"/>';
    }
    s+='</g>';
  });
  var C=['#ee7d52','#f4cd5c','#2b6fe0','#7fd6a0','#e23b3b'];
  s+='<path d="M0 18Q400 54 800 18" fill="none" stroke="#f1ede2" stroke-width="2"/>';
  for(i=0;i<16;i++){var x=25+i*50,t=x/800,y=18*((1-t)*(1-t)+t*t)+108*t*(1-t);s+='<polygon points="'+(x-18)+','+y.toFixed(1)+' '+(x+18)+','+y.toFixed(1)+' '+x+','+(y+34).toFixed(1)+'" fill="'+C[i%5]+'"/>'}
  s+='<polygon points="110,170 62,170 82,198 62,226 110,226" fill="#c9552f"/><polygon points="690,170 738,170 718,198 738,226 690,226" fill="#c9552f"/>';
  s+='<rect x="110" y="96" width="580" height="130" rx="16" fill="#ee7d52" stroke="#fff7e8" stroke-width="6"/><rect x="124" y="110" width="552" height="102" rx="10" fill="none" stroke="#fff7e8" stroke-width="2" stroke-dasharray="8 6" opacity=".7"/>';
  s+='<text x="400" y="172" text-anchor="middle" font-family="Rubik,sans-serif" font-weight="800" font-size="72" fill="#fff7e8" stroke="#7a2a10" stroke-width="8" paint-order="stroke">KATEDRA</text><text x="400" y="212" text-anchor="middle" font-family="Rubik,sans-serif" font-weight="800" font-size="36" fill="#fff7e8" stroke="#7a2a10" stroke-width="6" paint-order="stroke" letter-spacing="3">KÖZÉPISKOLA</text>';
  [[150,64],[650,64]].forEach(function(p){var pts=[];for(var k=0;k<10;k++){var R=k%2?10:24,a=-Math.PI/2+k*Math.PI/5;pts.push((p[0]+Math.cos(a)*R).toFixed(1)+','+(p[1]+Math.sin(a)*R).toFixed(1))}s+='<polygon points="'+pts.join(' ')+'" fill="#f4cd5c" stroke="#fff7e8" stroke-width="2"/>'});
  s+=cub(280,262,240,96,40,22,{front:'#b9523b',side:'#8c3a2a',top:'#d06a52'});
  for(i=0;i<6;i++)s+='<rect x="'+(292+i*38)+'" y="272" width="24" height="26" fill="#ffe28a"/>';
  [0,1,4,5].forEach(function(c){s+='<rect x="'+(292+c*38)+'" y="316" width="24" height="26" fill="#ffe28a"/>'});
  s+='<rect x="380" y="318" width="40" height="40" fill="#1f3a44"/><rect x="384" y="322" width="15" height="36" fill="#ffe28a"/><rect x="401" y="322" width="15" height="36" fill="#ffe28a"/><rect y="358" width="800" height="22" fill="#2f6b4a"/>';
  for(i=0;i<36;i++){var cx=Math.round(rnd()*780)+10,cy=Math.round(rnd()*330)+10;s+='<g class="conf" style="animation-delay:'+(rnd()*2.6).toFixed(2)+'s"><rect x="'+cx+'" y="'+cy+'" width="8" height="14" fill="'+C[i%5]+'" transform="rotate('+Math.round(rnd()*360)+' '+cx+' '+cy+')"/></g>'}
  return s+'</svg>';
}
var LIKES={
  sport:'Minden évben sportnapot szervezünk. Gyere, és játssz velünk!',
  it:'Szereted az informatikát? Az informatikai tagozat minden nap a jól felszerelt informatikatermeinket használja.',
  art:'Szereted a művészetet? A művészeti tagozat a művészeti műtermet, a grafikai termet és a művészeti műhelyt használja.',
  atm:'A barátságos hangulat a Katedra egyik legjobb dolga. Gyere el, és köszönj be!',
  gen:'Még nem tudod? Semmi baj. A gimnáziumi osztály jó hely arra, hogy sok mindent kipróbálj.'
};
function stepFinale(){
  stage.innerHTML=celebrateSVG();
  var tot=total(),max=NP*3,title=tot>=max*0.88?'Katedra-csillag':(tot>=max*0.72?'Szuperdiák':(tot>=max*0.5?'Ügyes felfedező':'Új barát'));
  var date=new Date().toLocaleDateString('hu-HU',{year:'numeric',month:'long',day:'numeric'});
  var recap=STEPS.slice(0,NP).map(function(x,i){var st=S.stars[i]||0;return '<li><span>'+x.t+'</span><span>'+x.lbl+'</span><span>'+new Array(st+1).join('★')+new Array(4-st).join('☆')+'</span></li>'}).join('');
  var res=S.name+' egy napot töltött a Katedra Középiskolában. Címe: '+title+'. Csillagok: '+tot+'/'+max+'. Elvesztett percek: '+S.lost+'.';
  setCard('<div class="meta"><span class="tag">15:50</span><span>A nap vége</span></div>'+talk(CAST.zoe,'Micsoda nap, '+N()+'! Tanultunk, játszottunk, és jól szórakoztunk. Köszönjük, hogy eljöttél a Katedrába!')+
    '<div class="cert"><p class="cert-co">Katedra Középiskola · Nyílt nap</p><h2>Diák egy napra</h2><p>Ezennel igazoljuk, hogy</p><p class="cert-name">'+esc(S.name||'Alex')+'</p><p>egy napot töltött iskolánkban, és megoldotta az összes feladványt.</p>'+
    '<p class="cert-row"><span>A címed</span><b>'+title+'</b></p><p class="cert-row"><span>Csillagok</span><b>'+tot+' / '+max+'</b></p><p class="cert-row"><span>Elvesztett percek</span><b>'+S.lost+'</b></p><p class="cert-date" style="color:var(--muted);font-size:14px">'+date+'</p></div>'+
    '<ul class="day" aria-label="A napod">'+recap+'</ul>'+
    '<p class="def">Mi tetszett ma a legjobban?</p><div class="chips" id="likes"><button type="button" class="chip" aria-pressed="false" data-k="sport">Sportnap</button><button type="button" class="chip" aria-pressed="false" data-k="it">Informatikaórák</button><button type="button" class="chip" aria-pressed="false" data-k="art">Művészetórák</button><button type="button" class="chip" aria-pressed="false" data-k="atm">A hangulat</button><button type="button" class="chip" aria-pressed="false" data-k="gen">Még nem tudom</button></div><p class="fb good" id="fb" role="status"></p>'+
    '<div class="copyrow"><input id="res" type="text" readonly aria-label="Eredmény szövege" value="'+esc(res)+'"><button class="btn ghost" id="copy" type="button">Eredmény másolása</button></div><div class="row"><button class="btn" id="again" type="button">Újra játszom</button></div>');
  $('likes').querySelectorAll('.chip').forEach(function(b){b.onclick=function(){
    $('likes').querySelectorAll('.chip').forEach(function(c){c.setAttribute('aria-pressed',c===b)});
    fb(LIKES[b.getAttribute('data-k')],'good');
  }});
  $('copy').onclick=function(){
    var t=$('res'),manual=function(){t.focus();t.select()};
    try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t.value).then(function(){fb('Kimásolva!','good')},manual);else manual()}catch(e){manual()}
  };
  $('again').onclick=showStart;
  S.locked=true;
}

/* ---------- start screen ---------- */
function saveProfile(){try{localStorage.setItem('katedraDay',JSON.stringify({h:S.hood}))}catch(e){}}
function loadProfile(){try{var p=JSON.parse(localStorage.getItem('katedraDay')||'null');if(p){if(p.h>=0&&p.h<4)S.hood=+p.h}}catch(e){}}
function showStart(){
  clearT();S.step=-1;S.stars=[];S.lost=0;S.notes=[];S.locked=false;
  renderHud();renderPips();renderNotes();$('nb').open=false;$('stage').parentNode.insertBefore($('nb'),$('stage'));
  mountYard({noTap:true});
  var sw='<div class="sw" role="radiogroup" aria-label="A pulóver színe">'+HOODS.map(function(c,i){return '<button type="button" class="swatch'+(S.hood===i?' on':'')+'" role="radio" aria-checked="'+(S.hood===i)+'" data-i="'+i+'" aria-label="Pulóver: '+HNAMES[i]+'" style="background:'+c+'"></button>'}).join('')+'</div>';
  setCard('<div class="intro"><div><h2>Üdv a Katedrában!</h2><p>A Katedra Középiskolában van művészeti tagozat, informatikai tagozat és gimnáziumi osztály. Ma a gimnáziumi osztályba jársz, és kipróbálsz egy informatikaórát és egy művészetórát is. A tanítás 8:15-kor kezdődik.</p><p>Keresd meg a helyes termeket, és oldj meg '+NP+' feladványt. Minden rossz próbálkozás perceket vesz el. A jegyzetfüzeted megőrzi, amit közben megtudsz.</p></div></div>'+
    '<form id="sf" class="field" style="flex-direction:column;align-items:stretch;gap:12px" autocomplete="off"><div class="field"><label class="lab" for="pname">A neved</label><input id="pname" class="txt" type="text" maxlength="16" placeholder="Írd be a keresztneved" value="" autocomplete="off"></div><div class="field"><span class="lab">Pulóver</span>'+sw+'</div><div><button class="btn" id="go" type="submit">Kezdődjön a nap!</button></div></form>');
  card.querySelectorAll('.swatch').forEach(function(b){b.onclick=function(){
    S.hood=+b.getAttribute('data-i');
    mountYard({noTap:true});
    card.querySelectorAll('.swatch').forEach(function(x){var on=x===b;x.classList.toggle('on',on);x.setAttribute('aria-checked',on)});
  }});
  $('sf').onsubmit=function(e){e.preventDefault();S.name=String($('pname').value).replace(/\s+/g,' ').trim().slice(0,16)||'Alex';saveProfile();go(0)};
}

loadProfile();
showStart();
})();
</script>
